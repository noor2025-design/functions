<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Functions</title>
    <link href="reset.css " rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <header>
      <h1>The Plate</h1>
      <h2>صحن</h2>
      <h3>New York City</h3>
    </header>
    <main>
      <!-- <p>A curated guide to recommending arabic restaurants in the city so you don't have to think about it.</p> -->
       <!-- <p>One Restuarant.One Dish.Zero Overthinking</p> -->
      <section class="user-inputs">
        <!-- A <select> tag element creates a dropdown menu with each <option> tag inside of each type of cuisine the user can pick from in the menu. I used the following references for how to set this up from https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/select,https://www.javascripttutorial.net/javascript-dom/javascript-select-box/ -->
        <form id="user-form">
          <label for="cuisine-select">Select a Cuisine Type:</label>
          <select name="cuisine" id="cuisine-select">
            <option value="">--Please choose an option--</option>
            <option value="moroccan">Moroccan</option>
            <option value="egyptian">Egyptian</option>
            <option value="palestinian">Palestinian</option>
            <option value="yemeni">Yemeni</option>
            <option value="lebanese">Lebanese</option>
            <option value="syrian">Syrian</option>
          </select>
          <label for="price-select">Select a Cuisine Type:</label>
          <select name="price" id="price-select">
            <option value="">--Select a Price Range--</option>
            <option value="$">$</option>
            <option value="$$">$$</option>
            <option value="$$$">$$$</option>
          </select>
          <button id="form-button" type="submit">Submit</button>
        </form>
      </section>
      <section id="selected-restaurant">
        <ul></ul>
      </section>
    </main>

    <footer>
      <!-- <p>TBD</p> -->
    </footer>
  </body>
</html>
