<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Functions</title>
    <link href="reset.css " rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script defer src="script.js"></script>
  </head>
  <body>
    <header>
      <h1>The Plate</h1>
      <h2>صحن</h2>
      <h3>New York City</h3>
    </header>
    <main>
      <!-- <p>A curated guide to recommending arabic restaurants in the city so you don't have to think about it.</p> -->
      <!-- <p>One Restuarant.One Dish.Zero Overthinking</p> -->
      <section class="user-inputs">
        <!-- A <select> tag element creates a dropdown menu with each <option> tag inside of each type of cuisine the user can pick from in the menu. I used the following references for how to set this up for my project from https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/select,https://www.javascripttutorial.net/javascript-dom/javascript-select-box/ -->
          <p>What are you in the mood for?</p>
        <form id="user-form">
          <label for="cuisine-select">Select a Cuisine Type:</label>
          <select name="cuisine" id="cuisine-select">
            <option value="">--Please choose an option--</option>
            <option value="moroccan">Moroccan</option>
            <option value="egyptian">Egyptian</option>
            <option value="palestinian">Palestinian</option>
            <option value="yemeni">Yemeni</option>
            <option value="lebanese">Lebanese</option>
            <option value="syrian">Syrian</option>
          </select>
          <!-- <label for="price-select">Select a Price Range:</label>
          <select name="price" id="price-select">
            <option value="">--Select a Price Range--</option>
            <option value="$">$</option>
            <option value="$$">$$</option>
            <option value="$$$">$$$</option>
          </select> -->

          <!-- I used <input type="radio"> to create a group of radio buttons. I learned that all radio buttons in the same group should share the same name so that only one option can be selected at a time. Each button also has a value when the form is submitted by the user and what javascript reads as the user selection. I also used "checked" on the "any price" button to set it to default so that users don't feel constrained to one price point. I used the HTML checked attribute on "any price" radio button to make it default selected option when the page first loads so that a value is always selected. Sources: https://www.w3schools.com/tags/att_input_type_radio.asp,https://www.geeksforgeeks.org/javascript/how-to-get-value-of-selected-radio-button-using-javascript/,https://www.w3schools.com/tags/att_input_checked.asp  -->
          <div>
            <p>What's the budget?</p>
            <p>Select a Price Range:</p>
            <input
              type="radio"
              name="price"
              value="$"
              id="low-price"
              class="price-input"
            />
            <label for="low-price">$</label>
            <input
              type="radio"
              name="price"
              value="$$"
              id="mid-price"
              class="price-input"
            />
            <label for="mid-price">$$</label>
            <input
              type="radio"
              name="price"
              value="$$$"
              id="high-price"
              class="price-input"
            />
            <label for="high-price">$$$</label>
            <input
              type="radio"
              name="price"
              value=""
              id="any-price"
              class="price-input"
              checked
            />
            <label for="any-price">Any Price</label>
          </div>

          <!-- I used <input type="checkbox"> inside <label> elements to create a group of borough filter options for users. Each checkbox has label matching the "id" with "for". All five checkboxes have the same name of "borough" so that I can use querySelectorAll in javascript to pull all the boroughs that the user selected. Source: https://www.javascripttutorial.net/javascript-dom/javascript-checkbox/ -->
            <p>What borough(s)?</p>
          <p>Select your preferred borough(s)</p>
          <label for="manhattan-checkbox">
            <input
              type="checkbox"
              name="borough"
              value="manhattan"
              id="manhattan-checkbox"
              class="borough-checkbox"
            />Manhattan</label
          >
          <label for="brooklyn-checkbox">
            <input
              type="checkbox"
              name="borough"
              value="brooklyn"
              id="brooklyn-checkbox"
              class="borough-checkbox"
            />Brooklyn</label
          >
          <label for="queens-checkbox">
            <input
              type="checkbox"
              name="borough"
              value="queens"
              id="queens-checkbox"
              class="borough-checkbox"
            />Queens</label
          >
          <label for="bronx-checkbox">
            <input
              type="checkbox"
              name="borough"
              value="bronx"
              id="bronx-checkbox"
              class="borough-checkbox"
            />Bronx</label
          >
          <label for="staten-island-checkbox">
            <input
              type="checkbox"
              name="borough"
              value="staten-island"
              id="staten-island-checkbox"
              class="borough-checkbox"
            />Staten Island</label
          >
          <button id="form-button" type="submit">Submit</button>
        </form>
      </section>
      <section id="selected-restaurant">
        <ul></ul>
      </section>
    </main>

    <footer>
      <!-- <p>TBD</p> -->
    </footer>
  </body>
</html>
